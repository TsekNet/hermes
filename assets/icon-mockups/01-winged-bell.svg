<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="88" y1="56" x2="424" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold" x1="160" y1="80" x2="352" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0D060"/>
      <stop offset="1" stop-color="#C8A030"/>
    </linearGradient>
    <linearGradient id="wingL" x1="180" y1="160" x2="40" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8C848"/>
      <stop offset="1" stop-color="#C8A030"/>
    </linearGradient>
    <linearGradient id="wingR" x1="332" y1="160" x2="472" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8C84C"/>
      <stop offset="1" stop-color="#C8A030"/>
    </linearGradient>
    <linearGradient id="shine" x1="180" y1="100" x2="320" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDE8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFFDE8" stop-opacity=".06"/>
    </linearGradient>
    <filter id="soft" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dy="6"/>
      <feComposite in2="SourceAlpha" operator="out"/>
      <feColorMatrix values="0 0 0 0 0.94 0 0 0 0 0.82 0 0 0 0 0.18 0 0 0 .25 0"/>
      <feBlend in2="BackgroundImageFix" result="shadow"/>
      <feBlend in="SourceGraphic" in2="shadow" result="shape"/>
    </filter>
    <filter id="bellShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <g filter="url(#soft)" transform="translate(0,44)">
    <!-- Wings: behind bell -->
    <polygon points="180,148 48,148 58,184 180,184" fill="url(#wingL)"/>
    <polygon points="172,190 82,190 92,226 172,226" fill="url(#wingL)"/>
    <polygon points="160,232 116,232 126,268 160,268" fill="url(#wingL)"/>
    <polygon points="332,148 464,148 454,184 332,184" fill="url(#wingR)"/>
    <polygon points="340,190 430,190 420,226 340,226" fill="url(#wingR)"/>
    <polygon points="352,232 396,232 386,268 352,268" fill="url(#wingR)"/>

    <!-- Bell top nub -->
    <circle cx="256" cy="96" r="16" fill="#D4A843"/>

    <!-- Bell shadow: lifts bell off wings -->
    <path d="M256 96c-72 0-120 56-120 128v64c0 16-16 32-32 32h304c-16 0-32-16-32-32V224c0-72-48-128-120-128z" fill="#000" fill-opacity=".3" transform="translate(0,4)" filter="url(#bellShadow)"/>
    <!-- Bell body -->
    <path d="M256 96c-72 0-120 56-120 128v64c0 16-16 32-32 32h304c-16 0-32-16-32-32V224c0-72-48-128-120-128z" fill="url(#gold)"/>
    <!-- Bell base bar -->
    <rect x="96" y="320" width="320" height="24" rx="12" fill="#D4A843"/>
  </g>

</svg>
